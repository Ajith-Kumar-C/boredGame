<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>XO Arcade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ui-container">
        <a href="../index.html" id="homeBtn">⬅ Home</a>
        <div class="stats-top">TURN: <span id="turnDisplay">X</span></div>
    </div>
    <div class="game">
        <div id="board">
            <div class="cell" onclick="makeMove(0)"></div>
            <div class="cell" onclick="makeMove(1)"></div>
            <div class="cell" onclick="makeMove(2)"></div>
            <div class="cell" onclick="makeMove(3)"></div>
            <div class="cell" onclick="makeMove(4)"></div>
            <div class="cell" onclick="makeMove(5)"></div>
            <div class="cell" onclick="makeMove(6)"></div>
            <div class="cell" onclick="makeMove(7)"></div>
            <div class="cell" onclick="makeMove(8)"></div>
        </div>
        <div id="gameOverBanner" class="hidden">
            <h2 id="winStatus">X WINS!</h2>
            <button class="restart-btn" onclick="resetBoard()">PLAY AGAIN</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
