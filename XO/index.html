<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../common.css">
    <style>
        #board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 20px; height: 80%; }
        .cell { background: #f1f2f6; border-radius: 8px; border: 3px solid var(--primary-dark); display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: bold; cursor: pointer; }
        .cell:hover { background: var(--lego-yellow); }
    </style>
</head>
<body>
    <div class="ui-header">
        <a href="../index.html" id="homeBtn">⬅ HOME</a>
        <div class="stats-top">TURN: <span id="turnDisplay">X</span></div>
    </div>
    <div class="game-monitor">
        <div id="board">
            <div class="cell" onclick="makeMove(0)"></div>
            <div class="cell" onclick="makeMove(1)"></div>
            <div class="cell" onclick="makeMove(2)"></div>
            <div class="cell" onclick="makeMove(3)"></div>
            <div class="cell" onclick="makeMove(4)"></div>
            <div class="cell" onclick="makeMove(5)"></div>
            <div class="cell" onclick="makeMove(6)"></div>
            <div class="cell" onclick="makeMove(7)"></div>
            <div class="cell" onclick="makeMove(8)"></div>
        </div>
        <div id="gameOverBanner" class="banner hidden">
            <h2 id="winStatus">X WINS!</h2>
            <button class="restart-btn" onclick="resetBoard()">PLAY AGAIN</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
