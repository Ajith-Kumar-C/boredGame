<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dragon Run</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="gameGuidance">Press Space to Jump | P to Pause</div>
    <div class="game" id="gameCanvas">
        <div id="character">🏃</div>
        <div id="block">🌵</div>
        <div id="pauseOverlay" class="hidden">PAUSED</div>
    </div>
    <div class="stats">
        <p>Score: <span id="scoreSpan">0</span></p>
        <p>High Score: <span id="highScore">0</span></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
