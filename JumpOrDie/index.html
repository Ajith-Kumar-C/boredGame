<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jump Or Die</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="gameGuidance">Press Space to Jump | P to Pause</div>
    <div class="game" id="gameCanvas">
        <div id="character">
            <div class="head"></div>
            <div class="body"></div>
            <div class="leg left"></div>
            <div class="leg right"></div>
        </div>
        
        <div id="block">
            <div class="leaves"></div>
            <div class="trunk"></div>
        </div>
        
        <button id="pauseBtn" onclick="togglePause()">Pause</button>

        <div id="gameOverBanner" class="hidden">
            <h1>GAME OVER</h1>
            <p>Score: <span id="finalScore">0</span></p>
            <button class="restart-btn" onclick="resetGame()">Try Again</button>
        </div>
    </div>

    <div class="stats">
        <p>Score: <span id="scoreSpan">0</span></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
