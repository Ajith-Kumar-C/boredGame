<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ARCADE ARENA</title>
    <link rel="stylesheet" href="common.css">
    <style>
        #gameGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; width: 90%; max-width: 1000px; margin-top: 40px; }
        .card { background: var(--primary-dark); border-radius: 20px; padding: 10px; text-decoration: none; box-shadow: 0 10px 0 #111; }
        .screen { background: #95afc0; aspect-ratio: 1/1; border-radius: 10px; border: 4px solid #111; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.5rem; text-align: center; }
        .card:hover .screen { background: var(--lego-yellow); color: var(--primary-dark); }
    </style>
</head>
<body>
    <h1 style="font-size: 4rem; text-shadow: 4px 4px var(--lego-yellow);">ARCADE ARENA</h1>
    <div id="gameGrid"></div>

    <script>
        const folders = ["JumpOrDie", "XO", "Pictionary"]; // You can also use the GitHub API fetch logic here
        const grid = document.getElementById('gameGrid');

        folders.forEach(f => {
            const name = f.replace(/([A-Z])/g, ' $1').toUpperCase();
            grid.innerHTML += `<a href="./${f}/index.html" class="card"><div class="screen"><h2>${name}</h2></div></a>`;
        });
    </script>
</body>
</html>
