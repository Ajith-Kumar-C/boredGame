<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ARCADE ARENA</title>
    <link rel="stylesheet" href="common.css">
    <style>
        h1 { margin-top: 50px; text-shadow: 3px 3px var(--lego-yellow); font-size: 3rem; }
        #gameGrid { 
            display: grid; grid-template-columns: repeat(2, 1fr); 
            gap: 20px; width: 90%; max-width: 500px; margin-top: 30px; 
        }
        .tile {
            background: var(--primary-dark); aspect-ratio: 1/1; border-radius: 15px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-decoration: none; color: white; border: 4px solid #111;
            box-shadow: 0 8px 0 #111; transition: 0.2s;
        }
        .tile:hover { transform: translateY(-4px); background: var(--lego-yellow); color: #111; }
        .tile i { font-size: 40px; margin-bottom: 10px; }
        .tile span { font-weight: bold; font-size: 14px; text-align: center; }
    </style>
</head>
<body>
    <h1>ARCADE ARENA</h1>
    <div id="gameGrid">
        <a href="./JumpOrDie/index.html" class="tile"><i>🏃</i><span>DRAGON JUMP</span></a>
        <a href="./XO/index.html" class="tile"><i>❌</i><span>XO BLOCK</span></a>
        <a href="./Pictionary/index.html" class="tile"><i>🎨</i><span>SKETCH IT</span></a>
        <div class="tile" style="opacity:0.5"><i>🔒</i><span>MORE SOON</span></div>
    </div>
</body>
</html>
