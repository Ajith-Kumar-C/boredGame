<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Game Portal</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #222; color: white; }
        .container { display: flex; justify-content: center; gap: 20px; margin-top: 50px; }
        .game-card { 
            border: 2px solid #444; padding: 20px; width: 150px; 
            cursor: pointer; transition: 0.3s; background: #333; border-radius: 10px;
        }
        .game-card:hover { transform: scale(1.1); background: #444; border-color: #00ff00; }
        a { text-decoration: none; color: inherit; }
    </style>
</head>
<body>
    <h1>Welcome to My Arcade</h1>
    <div class="container">
        <a href="Game1/index.html">
            <div class="game-card">
                <h2>🏃</h2>
                <p>Dragon Run</p>
            </div>
        </a>

        <div class="game-card" style="opacity: 0.5;">
            <h2>❓</h2>
            <p>Coming Soon</p>
        </div>
    </div>
</body>
</html>
